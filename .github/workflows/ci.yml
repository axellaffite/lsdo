name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (JVM, Android; iOS targets are skipped on Linux)
        run: ./gradlew build

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS simulator tests and the iOS capture
        run: ./gradlew :lsdo-runtime:iosSimulatorArm64Test :lsdo-runtime-compose:compileKotlinIosSimulatorArm64
