name: Release

# Pushing a tag vX.Y.Z builds, tests and publishes X.Y.Z to Maven Central (see docs/releasing.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    # macOS: the iOS klibs can only be built there.
    runs-on: macos-latest
    steps:
      # Secrets only reach the two steps that need them, never the third-party actions.
      - name: Check secrets
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        run: |
          missing=""
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] || missing="$missing SIGNING_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/releasing.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## $version( |\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' entry"
            exit 1
          fi
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -PVERSION_NAME="$VERSION_NAME"

      # Configuration cache off: the release path cannot be tried before a tag, so keep it on the plainest setup.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          # Empty when the key has no passphrase.
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral -PVERSION_NAME="$VERSION_NAME" --no-configuration-cache
